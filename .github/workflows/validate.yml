name: Validate source lists

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate JSON and LibreTV SourceList structure
        run: python scripts/validate.py
      - name: Test validator
        run: python -m unittest discover -s tests -p test_validate.py -v
